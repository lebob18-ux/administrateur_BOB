<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration FBM & Chantiers</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Écran de connexion par mot de passe -->
  <div id="auth-overlay" class="modal-overlay">
    <div class="modal-box">
      <h2>🔐 Sécurité Admin</h2>
      <p>Entre le mot de passe de l'application.</p>
      <input type="password" id="admin-password-input" placeholder="Mot de passe..." style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
      <button onclick="verifierMotDePasse()" style="width:100%; padding:10px; background:#7C2270; color:white; border:none; font-weight:bold; border-radius:5px; cursor:pointer;">Connexion</button>
      <p id="auth-error" style="color:red; font-size:0.8em; margin-top:8px; display:none;"></p>
    </div>
  </div>

  <!-- Contenu Principal (masqué par défaut tant qu'on n'est pas connecté) -->
  <div id="main-app" style="display:none; max-width: 600px; margin: 0 auto; padding: 15px;">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 style="font-size: 1.3em; color: #7C2270;">⚙️ Pilotage Central</h1>
      <button onclick="deconnexionAdmin()" style="background:#eee; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:0.85em;">Déconnexion</button>
    </header>

    <!-- Section 1 : Gestion des Utilisateurs -->
    <section class="card">
      <h2>👥 Gestion des Accès Utilisateurs</h2>
      <p style="font-size: 0.85em; color: #666; margin-bottom: 10px;">Valide les droits FBM ou Admin des utilisateurs.</p>
      <div id="utilisateurs-container">
        <p style="color:#999; font-size:0.9em;">Chargement...</p>
      </div>
    </section>

    <!-- Section 2 : Gestion des Chantiers / Supports -->

  </div>

  <script src="app.js"></script>
</body>
</html>
